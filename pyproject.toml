[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-clone"
version = "1.0.0"
description = "ADR: Audio Disentangled Reconstruction — low-resource fast voice cloning training framework"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ADR Team"}]
requires-python = ">=3.10"
keywords = ["tts", "voice-cloning", "low-resource", "training-framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心依赖（M1 必需 + TTS 服务运行时）
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "tqdm>=4.65",
    "soundfile>=0.12",
    "librosa>=0.10",
    "transformers>=4.35",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

# 可选依赖（按需安装）
[project.optional-dependencies]
# M1 完整功能
m1 = [
    "gradio>=6",
    "faster-whisper>=1.0",
    "g2pW>=0.1",
    "pypinyin>=0.49",
    "onnxruntime>=1.15",
]
# M2 训练加速 (LoRA/QLoRA)
m2 = [
    "peft>=0.7",
    "bitsandbytes>=0.41",
]
# 全量
all = [
    "adr-clone[m1,m2]",
]
# 开发
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1",
    "mypy>=1.6",
]

[project.urls]
Homepage = "https://github.com/adr-team/adr"
Documentation = "https://adr-team.github.io/adr"
Repository = "https://github.com/adr-team/adr"
Issues = "https://github.com/adr-team/adr/issues"

[project.scripts]
adr = "adr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adr*"]
exclude = ["tests*", "examples*", "scripts*"]

[tool.setuptools.package-data]
adr = ["py.typed", "configs/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
