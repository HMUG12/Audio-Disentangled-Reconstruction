# ADR 默认配置 (适用于 8GB+ GPU)
# 用户可在 ~/.adr/config.yaml 覆盖

framework_version: "0.1.0"
config_preset: "default"

# ===== 数据 =====
data:
  sample_rate: 24000
  hop_length: 256
  n_mels: 80
  n_fft: 1024
  win_length: 1024
  fmin: 0.0
  fmax: 12000.0
  enable_separation: true
  enable_denoise: true
  slice_min_sec: 3.0
  slice_max_sec: 10.0
  slice_min_silence_sec: 0.3
  asr_model: "small"
  g2p_backend: "g2pW"

# ===== 训练 =====
train:
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  num_epochs: 10
  max_steps: -1
  optimizer: "adamw"
  weight_decay: 0.01
  warmup_steps: 200
  max_grad_norm: 1.0
  lr_scheduler: "cosine"
  precision: "fp16"
  use_gradient_checkpointing: true
  use_flash_attn: false
  use_qlora: false
  qlora_r: 16
  qlora_alpha: 32
  qlora_dropout: 0.05
  qlora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  save_every_n_steps: 500
  save_every_n_epochs: 1
  keep_last_n_checkpoints: 3
  log_every_n_steps: 50

# ===== 推理 =====
infer:
  n_timesteps: 20
  speed: 1.0
  pitch_shift: 0
  energy_scale: 1.0
  noise_scale: 0.0
  top_k: 50
  top_p: 0.9
  temperature: 1.0

# ===== 路径 =====
path:
  cache_dir: "~/.cache/adr"
  pretrained_dir: "~/.cache/adr/pretrained"
  output_dir: "./output"
  log_dir: "./logs"
  data_dir: "./data"
