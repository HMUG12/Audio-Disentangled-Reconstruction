name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # 批次76 (#22): 发布门禁 — v* tag 不再直接构建推送。版本面 / tag 对齐 /
  # 依赖漂移 / 语法 四项任一项红, build-push 不会启动, 因此不会产出正式镜像。
  # 纯源码断言, 不装项目依赖, 十几秒即可跑完 (全量单测仍由 smoke.yml 负责)。
  gate:
    name: release gate (版本面 + tag + 依赖)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tag 发布必须与 pyproject 事实源同版, 否则 v1.4.0 会打出 1.3.1 的镜像
      - name: 版本面一致性 + tag 对齐
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/check_versions.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_versions.py
          fi

      - name: 合规门禁断言
        run: python scripts/check_compliance.py

      # #23: 依赖声明必须带上限, 且包含 build_runtime.ps1 / 容器钉版
      - name: 依赖版本漂移门禁
        run: python scripts/check_requirements.py

      - name: 语法编译门禁
        run: python -m compileall -q adr scripts

  build-push:
    name: build & push (${{ matrix.variant }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version (tag 剥 v 前缀; dispatch 回退 pyproject)
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publishing version: $VER (variant: ${{ matrix.variant }})"

      # ghcr 镜像路径必须全小写 (owner HMUG12 -> hmug12)
      - name: Lowercase ghcr image path
        id: img
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "path=${REGISTRY}/${OWNER}/adr-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.path }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}-${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            TORCH_VARIANT=${{ matrix.variant }}
            ADR_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.variant }}
