# ADR 服务容器 (CPU 默认变体, 批次56 / v1.2 多形态分发)
#
# 镜像为纯 HTTP 服务形态 (无 WebUI):
#   入口: python -m adr.server --addr 0.0.0.0 --port 9881
#   健康检查: http://127.0.0.1:9881/api/adr/v1/health
#
# 用法 (CPU):
#   docker compose up -d --build        # 构建并后台启动
#   docker compose logs -f              # 跟随日志
#   docker compose down                 # 停止
#
# 用法 (GPU, 需 NVIDIA 驱动; Docker Desktop WSL2 后端内置 GPU 支持):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# 数据持久化:
#   ./data       -> /data    (ADR_DATA_DIR: 档案/输出/TTS缓存/HF缓存, bind mount)
#   named volume -> 权重自引导目录 (首启自动下载约 2GB: pretrained_models + G2PWModel)
#
# 注意: 容器内监听 0.0.0.0 (端口映射必需), 默认只发布到宿主机回环地址;
# 若改为对外发布 (如 "0.0.0.0:9881:9881"), 必须设置 ADR_TTS_API_KEY
# (详见 docker/README.md 与 adr/server/__main__.py 的启动告警)。

services:
  adr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TORCH_VARIANT: cpu
        # 网络受限时取消注释 (deb.debian.org HTTP/80 部分代理不覆盖):
        # APT_MIRROR: mirrors.tuna.tsinghua.edu.cn
    image: adr-server:1.2.0-cpu
    restart: unless-stopped
    shm_size: "2g"
    ports:
      # 默认仅本机可达; 局域网/公网访问改为 "0.0.0.0:9881:9881" 并设 ADR_TTS_API_KEY
      - "127.0.0.1:9881:9881"
    volumes:
      # 业务数据 (档案/输出/缓存): 宿主机 docker/data/ 目录
      - ./data:/data
      # 模型权重自引导目录 (named volume, 不遮蔽镜像内 GSV 代码)
      - pretrained_models:/app/third_party/gpt_sovits/pretrained_models
      - g2pw_model:/app/third_party/gpt_sovits/text/G2PWModel
    environment:
      # 批次62 无 UI 形态条款 gate: 容器默认**拒绝启动** (exit 2), 需显式
      # 同意使用条款 — 取消下行注释即视为你已阅读并同意 (要点见 README)。
      # 同意标记会写入挂载的 /data (.terms_agreed_v1), 仅需同意一次。
      # ADR_AGREE_TERMS: "1"
      # 可选: 关闭审计日志 / 分发 WAV AI 生成标识 (默认均开)
      # ADR_SAFETY_AUDIT: "0"
      # ADR_WAV_METADATA: "0"

volumes:
  pretrained_models:
  g2pw_model:
