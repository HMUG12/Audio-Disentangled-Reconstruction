[package]
name = "adr-desktop"
version = "1.3.1"
description = "ADR Studio 桌面壳: 托管本地 ADR TTS 服务 (Python sidecar)"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[lib]
name = "adr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
open = "5"
# 批次73: 安装包下载后 SHA256 校验 (完整性硬门槛, 不校验不装)
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
