[package]
name = "adr-desktop"
version = "1.0.0"
description = "ADR Studio 桌面壳: 托管本地 ADR TTS 服务 (Python sidecar)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "adr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
