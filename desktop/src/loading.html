<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ADR Studio</title>
<script src="theme.js"></script>
<style>
  /* classic: 原暗色配色 (变量取原值) */
  :root {
    color-scheme: dark;
    --bg: #0b1120; --txt: #e2e8f0; --ring: #1e293b; --ring-top: #2dd4bf;
    --status: #94a3b8; --hint: #475569;
    --back-bg: #16202f; --back-txt: #aebad0; --back-line: #2b3a55;
    --back-hover: #2dd4bf66; --back-hover-txt: #e8ecf4; --h1: #e2e8f0;
  }
  /* default: 浅蓝手绘风 */
  [data-theme="default"] {
    color-scheme: light;
    --bg: #F0F7FF; --txt: #1A202C; --ring: #D6E9FD; --ring-top: #5EAAF7;
    --status: #718096; --hint: #718096;
    --back-bg: #FFFFFF; --back-txt: #2B6CB0; --back-line: #A9D0FA;
    --back-hover: #2B6CB0; --back-hover-txt: #2B6CB0; --h1: #2B6CB0;
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: var(--bg); color: var(--txt);
    font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    user-select: none;
  }
  .box { text-align: center; }
  .mascot {
    width: 132px; height: 132px; margin: 0 auto 18px; display: block;
    object-fit: contain; animation: breath 3.6s ease-in-out infinite;
  }
  .bar { width: 168px; height: 3px; margin: 16px auto 0; border-radius: 999px;
    background: var(--ring); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: inherit;
    background: var(--ring-top); animation: slide 1.4s ease-in-out infinite; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: .5px; color: var(--h1); }
  #status { font-size: 13px; color: var(--status); min-height: 18px; }
  .hint { font-size: 12px; color: var(--hint); margin-top: 26px; }
  @keyframes breath {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.015); }
  }
  @keyframes slide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mascot, .bar i { animation: none; }
    .bar i { width: 100%; }
  }
  #back {
    display: none; margin: 22px auto 0; background: var(--back-bg); color: var(--back-txt);
    border: 1px solid var(--back-line); border-radius: 8px; padding: 8px 18px;
    font-size: 13px; cursor: pointer;
  }
  #back:hover { border-color: var(--back-hover); color: var(--back-hover-txt); }

</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body data-adr-page="loading">
  <div class="box">
    <img class="mascot" id="mascot" src="assets/mascot/load.png" alt="">
    <h1>正在准备引擎</h1>
    <div id="status">马上就好…</div>
    <div class="bar"><i></i></div>
    <button id="back" onclick="goLauncher()">← 返回启动器</button>
    <div class="hint">第一次启动会久一点，之后就快了。</div>
  </div>
<script>
  // 壳通过 eval 调用此函数更新启动状态
  window.__adrStatus = function (text) {
    document.getElementById("status").textContent = text;
    // 出现失败/超时字样时亮出返回按钮, 避免卡死在加载页
    if (/失败|超时/.test(text)) {
      document.getElementById("back").style.display = "block";
      document.getElementById("mascot").src = "assets/mascot/work.png";
    }
  };
  function goLauncher() {
    // P0: 不再直接 location.replace 绕过门禁 — 首启 / 预热 / 登录未完成时
    // 壳侧会拒绝, 这里把原因显示出来, 而不是跳进半成品启动器。
    if (!window.__TAURI__) {
      document.getElementById("status").textContent = "请在本机桌面应用中操作";
      return;
    }
    window.__TAURI__.core.invoke("back_to_launcher").catch((e) => {
      document.getElementById("status").textContent = String(e);
    });
  }
</script>
</body>
</html>
